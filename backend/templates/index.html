<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title>
<link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Rubric scores plus LLM coaching tips.</p>
<form method="post" action="/ui/calls"><input name="title" required/>
    <textarea name="transcript" rows="4">Sorry for the wait — I understand the issue. We fixed it and will follow up by email.</textarea>
    <button>Score call</button></form>
    <ul>{% for c in calls %}<li>{{ c.title }} — {{ c.status }}</li>{% endfor %}</ul>
</main></body></html>
