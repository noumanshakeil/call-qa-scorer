[project]
name = "call-qa-scorer"
version = "2.0.0"
description = "Score support calls against a rubric with dimension scores and LLM coaching tips for managers."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
